<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockhound</title>
<style>
  body { margin:0; background:#2B2118; color:#F5F1E8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { max-width:560px; padding:48px 32px; text-align:center; }
  h1 { font-size:2.2rem; margin-bottom:0.4rem; color:#8FA98C; }
  p.tagline { font-size:1.1rem; opacity:0.85; margin-bottom:2rem; }
  .accent { color:#8FA98C; }
  .badge { display:inline-block; padding:6px 16px; border:1px solid #8FA98C; border-radius:999px; font-size:0.85rem; margin-bottom:1.5rem; }
  footer { margin-top:2.5rem; font-size:0.8rem; opacity:0.6; }
  a { color:#8FA98C; }

  @keyframes floatOrb {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px,-40px) scale(1.08); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(16px); }
    to { opacity:1; transform: translateY(0); }
  }
  .orb {
    position: fixed; top: -120px; right: -120px; width: 420px; height: 420px;
    background: radial-gradient(circle, #8FA98C55 0%, #8FA98C00 70%);
    filter: blur(10px); pointer-events: none; z-index: 0;
    animation: floatOrb 9s ease-in-out infinite;
  }
  .wrap { position: relative; z-index: 1; }
  h1 { animation: fadeUp 0.8s ease-out both; }
  p.tagline { animation: fadeUp 0.8s ease-out 0.15s both; }
  .feature { animation: fadeUp 0.8s ease-out both; transition: transform 0.25s ease; }
  .feature:nth-of-type(1) { animation-delay: 0.3s; }
  .feature:nth-of-type(2) { animation-delay: 0.45s; }
  .feature:hover { transform: translateY(-3px); }
  footer { animation: fadeUp 0.8s ease-out 0.6s both; }
</style>
</head>
<body>
<div class="orb"></div>
  <div class="card">
    <div class="badge">iOS App</div>
    <h1>Rockhound</h1>
    <p class="tagline">Log rocks, minerals, and gemstones found or bought.</p>
    <p>Log specimens with location found and type for free. Upgrade to <span class="accent">Rockhound Pro</span> for unlimited specimens and mohs-hardness sort.</p>
    <footer>
      <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Use</a><br>
      Contact: s0533495227@gmail.com
    </footer>
  </div>
</body>
</html>
