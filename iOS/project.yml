name: Rockhound
options:
  bundleIdPrefix: com.shimondeitel.rockhound
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Rockhound:
    type: application
    platform: iOS
    sources:
      - path: Rockhound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.rockhound
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Rockhound/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  RockhoundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RockhoundTests
      - path: Rockhound.storekit
    dependencies:
      - target: Rockhound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.rockhound.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  RockhoundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RockhoundUITests
    dependencies:
      - target: Rockhound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.rockhound.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Rockhound:
    build:
      targets:
        Rockhound: all
        RockhoundTests: [test]
        RockhoundUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Rockhound.storekit
    test:
      config: Debug
      storeKitConfiguration: Rockhound.storekit
      targets:
        - RockhoundTests
        - RockhoundUITests
    archive:
      config: Release
